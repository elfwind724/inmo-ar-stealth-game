<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#123b30">
  <title>2026 圣诞彩排抽号</title>
  <link rel="stylesheet" href="/rehearsal/style.css">
  <link rel="stylesheet" href="/rehearsal/draw-motion.css">
  <script defer src="/rehearsal/boot.js"></script>
  <script id="app-script" defer src="/rehearsal/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-copy">
        <p class="event"><span aria-hidden="true">✦</span> 2026 教堂圣诞彩排</p>
        <h1>彩排抽号</h1>
      </div>
    </header>

    <main id="participants" class="layout">
      <section class="card action-card" aria-labelledby="action-title">
        <h2 id="action-title" class="visually-hidden">抽取彩排号码</h2>
        <div id="load-help" class="notice" role="status">
          <p id="load-message">正在准备抽号页面…</p>
          <a href="/rehearsal/?reload=1">重新加载页面</a>
        </div>
        <noscript><p class="notice error">请在浏览器设置中开启 JavaScript，或用手机自带浏览器打开。</p></noscript>
        <div class="phase-line">
          <div id="phase-badge" class="phase"><span></span><strong id="phase-label">正在连接</strong></div>
          <p id="action-detail" class="muted" role="status">正在读取抽号状态。</p>
        </div>
        <form id="team-form" novalidate>
          <label for="team-name">小组名称</label>
          <input id="team-name" name="team-name" type="text" placeholder="请输入小组名称" autocomplete="off" autocapitalize="off" enterkeyhint="go" maxlength="80" aria-describedby="team-error" required>
          <button id="team-submit" class="button primary draw-button" type="submit">抽号</button>
          <p id="team-error" class="notice error" role="alert" hidden></p>
        </form>
        <p id="team-message" class="notice" role="status" hidden></p>
        <div id="draw-stage" hidden>
          <p id="draw-caption"></p>
          <p class="draw-display"><strong id="draw-number"></strong><span>号</span></p>
          <p id="draw-team"></p>
        </div>
      </section>

      <section class="card order-card" aria-labelledby="order-title">
        <div class="card-heading">
          <div>
            <h2 id="order-title">彩排顺序</h2>
            <p id="order-summary" class="muted" hidden></p>
          </div>
          <button id="refresh" class="button secondary compact" type="button">刷新</button>
        </div>
        <ol id="results" class="results" aria-label="按号码排序的彩排名单" hidden></ol>
        <p id="empty-results" class="empty">正在读取彩排顺序…</p>
        <p id="refresh-notice" class="refresh-notice muted" role="status" hidden></p>
      </section>
    </main>

    <main id="organizer" class="layout organizer-layout" hidden>
      <section class="card action-card" aria-labelledby="organizer-title">
        <h2 id="organizer-title">负责人入口</h2>
        <p id="organizer-hint" class="muted">输入负责人口令后管理报名和抽号。</p>
        <form id="auth-form" novalidate>
          <label for="organizer-key">负责人口令</label>
          <input id="organizer-key" type="password" autocomplete="current-password" maxlength="128" required>
          <button class="button primary" type="submit">进入管理</button>
        </form>
        <div id="admin-controls" hidden>
          <form id="admin-limit-form" class="limit-settings" novalidate>
            <label for="admin-number-limit">最大号码</label>
            <div class="limit-row">
              <input id="admin-number-limit" type="number" min="1" max="500" step="1" inputmode="numeric" aria-describedby="limit-help" required>
              <button class="button primary" type="submit">保存设置</button>
            </div>
            <p id="limit-help" class="muted">可设置 1–500，保存后立即生效。</p>
          </form>
          <form id="admin-roster-form" novalidate>
            <label for="roster-input">小组名单（选填）</label>
            <p id="roster-help" class="muted form-help">一行一个名字。也可以留空，让各组自行报名。</p>
            <textarea id="roster-input" rows="5" maxlength="42000" aria-describedby="roster-help" placeholder="每行填写一个小组名称"></textarea>
            <button id="admin-roster-submit" class="button primary" type="submit">开放报名</button>
          </form>
          <div class="admin-buttons">
            <button id="admin-start" class="button primary" type="button" hidden>开放抽号</button>
            <button id="admin-export" class="button secondary" type="button" hidden>下载彩排名单</button>
            <button id="admin-clear" class="button secondary remove-team" type="button" hidden>一键清空全部</button>
            <button id="admin-logout" class="button secondary" type="button">退出管理</button>
          </div>
        </div>
        <p id="admin-error" class="notice error" role="alert" hidden></p>
        <p id="admin-message" class="notice" role="status" hidden></p>
      </section>

      <section id="admin-list" class="card order-card" aria-labelledby="roster-title" hidden>
        <div class="card-heading">
          <div>
            <h2 id="roster-title">小组与号码</h2>
            <p id="roster-summary" class="muted"></p>
          </div>
          <button id="admin-refresh" class="button secondary compact" type="button">刷新</button>
        </div>
        <ul id="roster" class="results" aria-label="小组和号码" hidden></ul>
        <p id="empty-roster" class="empty">还没有小组记录。</p>
      </section>
    </main>

    <footer class="site-footer">
      <a id="view-link" href="#organizer">负责人入口</a>
    </footer>
  </div>
</body>
</html>
